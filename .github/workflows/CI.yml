name: CI

on:
  pull_request:
  # PR 병합·직접 푸시 등으로 master 가 갱신될 때도 검증한다.
  push:
    branches: [master]
  # GitHub 웹 Actions 탭에서 수동 실행 (publish.yml 과 동일한 방식).
  # "Run workflow" 버튼은 이 파일이 기본 브랜치에 있을 때만 나타난다.
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # tray-icon 이 Linux 에서 GTK 시스템 패키지를 요구하므로 windows 로 고정한다.
    # 릴리스 대상 플랫폼(publish.yml)과도 일치한다.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 오라클 대조(tools/oracle/*.py)용. 러너 기본 파이썬에 기대지 않고 고정한다.
      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2

      - name: install frontend dependencies
        run: npm --prefix frontend ci

      # frontend/dist 는 gitignore 대상인데 src/main.rs 가
      # #[folder = "frontend/dist/"] 로 임베드하므로, 빌드해 두지 않으면
      # cargo test 가 바이너리 타깃 컴파일 단계에서 실패한다.
      - name: build frontend
        run: npm --prefix frontend run build

      # CONTRIBUTING 이 기여자에게 안내하는 명령과 동일하게 유지한다.
      # 테스트 정의가 바뀌면(예: 프론트 테스트 추가) CI 도 자동으로 따라간다.
      # npm run ci = npm test(cargo) + npm run test:oracle(독립 오라클·프론트 대조).
      - name: test
        run: npm run ci
