[package]
name = "principal-candidate-manager"
version = "0.2.13"
edition = "2024"
authors = ["luminousky"]

[features]
dev = []

[dependencies]
axum        = { version = "0.7", features = ["multipart"] }
sqlx        = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio       = { version = "1", features = ["full"] }
rust-embed  = "8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tower-http  = { version = "0.5", features = ["cors"] }
anyhow      = "1"
mime_guess  = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# 두 지정은 성격이 다르다.
#   features=["rust_crypto"] — **필수**. 10.x는 crypto provider를 feature로 고르게
#     바뀌었고 기본값(use_pem)에는 provider가 없다. 빼면 컴파일은 통과하고
#     토큰 서명·검증 시점에 패닉한다(= 로그인 전면 실패). 타입이 아니라 런타임에
#     터지는 자리라 tests/auth.rs 의 roundtrip 테스트가 유일한 방어선이다.
#     provider 등록이 이 feature 전체에 걸려 있어(crypto/mod.rs) hmac만 켜는 식으로
#     좁힐 수 없다. aws_lc_rs 는 대안이지만 C 의존성을 끌어와 택하지 않았다.
#   default-features=false — 선택. 기본값의 use_pem(pem·simple_asn1)을 뺀다.
#     키를 PEM이 아니라 from_secret(HS256)으로만 다루므로 쓰지 않는 파서다.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
bcrypt       = "0.15"
rand         = "0.8"
calamine     = "0.22"
rust_xlsxwriter = "0.74"
# 백업 산출물(pcm 폴더 zip)용. calamine·rust_xlsxwriter가 이미 끌어오는 크레이트다.
# default-features를 끄는 것이 중요 — 기본값은 bzip2·lzma·zstd(=C 의존성)까지
# 켜서 빌드 시간과 공급망 표면을 늘린다. 백업 zip에는 deflate면 충분하다.
zip          = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs  = "0.8"
csv          = "1.3"
chrono       = { version = "0.4", features = ["serde"] }
tray-icon    = "0.22"
webbrowser   = "1"
image        = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
