[package]
name = "principal-candidate-manager"
version = "0.2.12"
edition = "2024"
authors = ["luminousky"]

[features]
dev = []

[dependencies]
axum        = { version = "0.7", features = ["multipart"] }
sqlx        = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio       = { version = "1", features = ["full"] }
rust-embed  = "8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tower-http  = { version = "0.5", features = ["cors"] }
anyhow      = "1"
mime_guess  = "2"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
jsonwebtoken = "10"
bcrypt       = "0.15"
rand         = "0.8"
calamine     = "0.22"
rust_xlsxwriter = "0.74"
# 백업 산출물(pcm 폴더 zip)용. calamine·rust_xlsxwriter가 이미 끌어오는 크레이트다.
# default-features를 끄는 것이 중요 — 기본값은 bzip2·lzma·zstd(=C 의존성)까지
# 켜서 빌드 시간과 공급망 표면을 늘린다. 백업 zip에는 deflate면 충분하다.
zip          = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs  = "0.8"
csv          = "1.3"
chrono       = { version = "0.4", features = ["serde"] }
tray-icon    = "0.22"
webbrowser   = "1"
image        = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
proptest = "1"
tower = { version = "0.5", features = ["util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
